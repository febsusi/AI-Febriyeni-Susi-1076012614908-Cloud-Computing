<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Review - AI Based Sentiment Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            {% if session.email %}
                <span class="text-white-50 small d-none d-md-inline">
                    Halo, <strong class="text-white">{{ session.name or session.email }}</strong>
                </span>
                <a href="{{ url_for('profile') }}" class="btn btn-sm btn-outline-light">Profil</a>
                <a href="{{ url_for('logout') }}" class="btn btn-sm btn-danger">Logout</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 850px;">
        <div class="card-header bg-warning text-dark">
            <strong>✏️ Update Data Review</strong>
        </div>

        <div class="card-body">
            <form action="{{ url_for('update', review_id=review.id) }}" method="POST">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Nama</label>
                        <input type="text" name="name" class="form-control"
                               value="{{ review.name }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control"
                               value="{{ review.email }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Kategori</label>
                        <select name="category" class="form-select" required>
                            {% for category in ["Aplikasi", "Website", "Produk", "Pelayanan"] %}
                                <option value="{{ category }}"
                                    {% if review.category == category %}selected{% endif %}>
                                    {{ category }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Rating</label>
                        <select name="rating" class="form-select" required>
                            {% for rating in [1,2,3,4,5] %}
                                <option value="{{ rating }}"
                                    {% if review.rating|int == rating %}selected{% endif %}>
                                    ⭐ {{ rating }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Review</label>
                        <textarea name="review" class="form-control" rows="5" required>{{ review.review }}</textarea>
                    </div>

                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-warning px-4">
                            💾 Update dan Analisis Ulang
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">
                            Batal
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
