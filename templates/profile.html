<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - AI Based Sentiment Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a href="{{ url_for('index') }}" class="btn btn-sm btn-outline-light">Beranda</a>
            <a href="{{ url_for('logout') }}" class="btn btn-sm btn-danger">Logout</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 620px;">
        <div class="card-header bg-sage text-center py-4">
            <strong>👤 Profil Saya</strong>
        </div>

        <div class="card-body text-center py-5">
            <div class="profile-avatar">
                {{ (name or email or "U")[0] | upper }}
            </div>
            <h4 class="fw-bold mb-1">{{ name or "Pengguna" }}</h4>
            <p class="text-muted mb-4">{{ email }}</p>

            <div class="text-start mx-auto" style="max-width: 380px;">
                <div class="mb-3">
                    <label class="form-label">User ID</label>
                    <input type="text" class="form-control" value="{{ local_id }}" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" value="{{ email }}" readonly>
                </div>
            </div>

            <div class="d-flex gap-2 justify-content-center mt-4">
                <a href="{{ url_for('index') }}" class="btn btn-sage px-4">Kembali</a>
                <a href="{{ url_for('logout') }}" class="btn btn-danger px-4">Logout</a>
            </div>
        </div>
    </div>
</main>

</body>
</html>
